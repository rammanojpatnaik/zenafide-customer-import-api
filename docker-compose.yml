services:
  api:
    build: .
    container_name: zenafide-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/zenafide
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operator@example.com}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator123}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: ${LOG_FILE:-/var/log/zenafide/app.log}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/zenafide/uploads}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_data:/var/log/zenafide
      - uploads_data:/var/lib/zenafide/uploads

  redis:
    image: redis:7-alpine
    container_name: zenafide-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: zenafide-db
    environment:
      POSTGRES_DB: zenafide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zenafide"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  logs_data:
  uploads_data:
  redis_data:
